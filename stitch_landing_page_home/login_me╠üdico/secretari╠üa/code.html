<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>ProHealth - Acceso profesional</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#0D6EFD",
              secondary: "#20C997",
              "background-light": "#F0F7FF",
              "background-dark": "#101822",
              "foreground-light": "#111827",
              "foreground-dark": "#f9fafb",
              "card-light": "#ffffff",
              "card-dark": "#1f2937",
              "input-light": "#e5e7eb",
              "input-dark": "#374151",
              "placeholder-light": "#6b7280",
              "placeholder-dark": "#9ca3af",
              error: "#ef4444",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              full: "9999px",
            },
          },
        },
      };
    </script>

    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>

  <body
    class="font-display bg-background-light dark:bg-background-dark text-foreground-light dark:text-foreground-dark"
  >
    <div
      class="min-h-screen flex items-center justify-center px-4 py-8 sm:py-12"
    >
      <div class="w-full max-w-md">
        <!-- Volver al inicio -->
        <a
          href="#"
          class="mb-6 inline-flex items-center gap-2 text-sm font-medium text-primary hover:text-primary/80"
        >
          <span aria-hidden="true">←</span>
          <span>Volver al inicio</span>
        </a>

        <!-- Card de login -->
        <div
          class="bg-card-light dark:bg-card-dark px-8 py-10 rounded-2xl shadow-xl shadow-primary/5"
        >
          <div class="text-center mb-8">
            <h1
              class="text-2xl sm:text-3xl font-bold tracking-tight text-foreground-light dark:text-foreground-dark"
            >
              Acceso profesional
            </h1>
            <p
              class="mt-3 text-sm text-placeholder-light dark:text-placeholder-dark"
            >
              Ingrese con sus credenciales para administrar
              <br />
              turnos y obras sociales.
            </p>
          </div>

          <form class="space-y-5" method="POST" action="#">
            <!-- Email -->
            <div>
              <label
                for="email"
                class="sr-only"
              >
                Email
              </label>
              <input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
                placeholder="Email *"
                class="block w-full rounded-lg border-0 bg-gray-50 dark:bg-input-dark py-3 px-4 text-sm text-foreground-light dark:text-foreground-dark placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark focus:ring-2 focus:ring-inset focus:ring-primary"
              />
            </div>

            <!-- Password -->
            <div>
              <label
                for="password"
                class="sr-only"
              >
                Contraseña
              </label>
              <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="Contraseña *"
                class="block w-full rounded-lg border-0 bg-gray-50 dark:bg-input-dark py-3 px-4 text-sm text-foreground-light dark:text-foreground-dark placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark focus:ring-2 focus:ring-inset focus:ring-primary"
              />
            </div>

            <!-- Botón -->
            <div class="pt-2">
              <button
                type="submit"
                class="flex w-full justify-center rounded-lg bg-primary px-4 py-3 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors"
              >
                Ingresar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body></html>
