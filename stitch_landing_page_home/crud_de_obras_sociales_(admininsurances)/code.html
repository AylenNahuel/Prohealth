<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProHealth Admin - Obras Sociales</title>

    <!-- Icono vacío por ahora -->
    <link
      rel="icon"
      type="image/x-icon"
      href="data:image/x-icon;base64,"
    />

    <!-- TailwindCSS (con plugins de forms y container-queries) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />

    <!-- Configuración de Tailwind: colores, fuente y bordes -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#42b6f0',
              'background-light': '#f6f7f8',
              'background-dark': '#101c22',
            },
            fontFamily: {
              display: ['Inter'],
            },
            borderRadius: {
              DEFAULT: '0.25rem',
              lg: '0.5rem',
              xl: '0.75rem',
              full: '9999px',
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-background-light dark:bg-background-dark font-display">
    <!-- Layout principal de la página -->

        <header

        >

            <div class="size-8 text-primary">

            <h2 class="text-lg font-bold">ProHealth Admin</h2>
          </div>

          <div class="flex flex-1 items-center justify-end gap-6">
            <!-- Links de navegación (solo en desktop) -->
            <nav class="hidden md:flex items-center gap-6">
              <a
                href="#"
                class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary"
              >
                Dashboard
              </a>
              <a
                href="#"
                class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary"

                href="#"
                class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-primary"

                Pacientes
              </a>
              <a
                href="#"
                class="text-sm font-bold text-primary"
              >
                Obras Sociales
              </a>
            </nav>

            <div class="flex items-center gap-4">
              <button

              >

                Obras Sociales
              </h1>

                class="flex items-center justify-center gap-2 rounded bg-primary px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-primary/80"

                <span class="material-symbols-outlined"> add </span>
                <span>Nueva obra social</span>
              </button>
            </div>

              class="overflow-hidden rounded-lg border border-primary/20 dark:border-primary/30 bg-white dark:bg-background-dark shadow-sm"
            >
              <div class="overflow-x-auto">

                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400"

                        class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400"

                        Nombre

                        class="relative px-6 py-3"

                      </th>
                    </tr>
                  </thead>

                            <span class="material-symbols-outlined"> edit </span>

                            <span class="material-symbols-outlined"> edit </span>
                          </button>
                          <button class="text-red-500 hover:text-red-700">
                            <span class="material-symbols-outlined"> delete </span>

                          <button class="text-red-500 hover:text-red-700">
