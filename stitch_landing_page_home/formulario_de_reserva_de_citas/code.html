<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ProHealth - Reservar turno</title>

    <!-- Tailwind con plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Configuración personalizada de Tailwind -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#0D6EFD",
              secondary: "#20C997",
              "background-light": "#F0F7FF",
              "background-dark": "#101822",
              "card-light": "#FFFFFF",
              "card-dark": "#1a2430",
            },
            fontFamily: {
              display: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Fix visual para selects -->
    <style>
      .form-input,
      .form-select {
        appearance: none;
      }
    </style>
  </head>

  <body
    class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200"
  >
    <!-- CONTENEDOR GENERAL -->
    <div class="flex flex-col min-h-screen">
      <!-- HEADER / NAVBAR -->
      <header
        class="bg-card-light dark:bg-card-dark/80 backdrop-blur-sm sticky top-0 z-50 shadow-sm"
      >
        <nav
          class="container mx-auto px-6 py-4 flex justify-between items-center"
        >
          <!-- LOGO + NOMBRE -->
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 text-primary">
              <svg fill="none" viewBox="0 0 48 48">
                <path
                  d="M4 42.4379C4 42.4379 14.0962 36.0744 24 41.1692C35.0664 46.8624 44 42.2078 44 42.2078L44 7.01134C44 7.01134 35.068 11.6577 24.0031 5.96913C14.0971 0.876274 4 7.27094 4 7.27094L4 42.4379Z"
                  fill="currentColor"
                ></path>
              </svg>
            </div>

            <h1 class="text-xl font-bold text-gray-900 dark:text-white">
              ProHealth
            </h1>
          </div>

          <!-- LINKS DESKTOP -->
          <div class="hidden md:flex items-center gap-8">
            <a
              class="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors"
              href="#"
            >
              Inicio
            </a>
            <a
              class="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors"
              href="#"
            >
              Servicios
            </a>
            <a
              class="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors"
              href="#"
            >
              Obras Sociales
            </a>
            <a
              class="text-gray-600 dark:text-gray-300 hover:text-primary transition-colors"
              href="#"
            >
              Contacto
            </a>
          </div>

          <!-- BOTÓN LOGIN -->
          <button
            class="hidden md:block bg-primary text-white font-bold py-2 px-4 rounded-lg hover:bg-primary/90 transition-colors"
          >
            Login
          </button>

          <!-- MENU MOBILE -->
          <button class="md:hidden text-gray-800 dark:text-gray-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor">
              <path
                d="M4 6h16M4 12h16m-7 6h7"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
          </button>
        </nav>
      </header>

      <!-- CONTENIDO PRINCIPAL -->
      <main
        class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8"
      >
        <div
          class="w-full max-w-lg space-y-8 p-10 bg-card-light dark:bg-card-dark rounded-xl shadow-2xl"
        >
          <!-- TÍTULO -->
          <div>
            <h2
              class="mt-6 text-center text-3xl font-extrabold text-gray-900 dark:text-white"
            >
              Reservar turno
            </h2>
            <p
              class="mt-2 text-center text-sm text-gray-600 dark:text-gray-400"
            >
              Elegí la fecha y horario disponibles, completá tus datos y nos
              comunicaremos para confirmar el turno.
            </p>
          </div>

          <!-- FORMULARIO -->
          <form class="mt-8 space-y-6" method="POST">
            <!-- CAMPOS -->
            <div class="space-y-4">
              <!-- Nombre -->
              <div>
                <label class="text-sm font-medium" for="name"
                  >Nombre y apellido</label
                >
                <input
                  id="name"
                  name="name"
                  type="text"
                  placeholder="Juan Pérez"
                  required
                  autocomplete="name"
                  class="mt-1 block w-full px-4 py-3 bg-background-light dark:bg-background-dark border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:ring-primary focus:border-primary"
                />
              </div>

              <!-- Teléfono -->
              <div>
                <label class="text-sm font-medium" for="phone">Teléfono</label>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  placeholder="11 2345-6789"
                  required
                  autocomplete="tel"
                  class="mt-1 block w-full px-4 py-3 bg-background-light dark:bg-background-dark border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:ring-primary focus:border-primary"
                />
              </div>

              <!-- Email -->
              <div>
                <label class="text-sm font-medium" for="email">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="usuario@ejemplo.com"
                  required
                  autocomplete="email"
                  class="mt-1 block w-full px-4 py-3 bg-background-light dark:bg-background-dark border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:ring-primary focus:border-primary"
                />
                <p class="mt-2 text-xs text-red-600 hidden">
                  Debe ser un email válido.
                </p>
              </div>

              <!-- Obra Social -->
              <div>
                <label class="text-sm font-medium" for="insurance"
                  >Obra social</label
                >
                <div class="relative mt-1">
                  <select
                    id="insurance"
                    name="insurance"
                    required
                    class="form-select block w-full px-4 py-3 bg-background-light dark:bg-background-dark border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:ring-primary focus:border-primary"
                  >
                    <option>Seleccione su obra social</option>
                    <option>OSDE</option>
                    <option>Swiss Medical</option>
                    <option>Galeno</option>
                    <option>IOMA</option>
                    <option>OMINT</option>
                    <option>Particular</option>
                  </select>

                  <!-- Flechita decorativa del select -->
                  <div
                    class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2"
                  >
                    <svg
                      class="fill-current h-4 w-4"
                      viewBox="0 0 20 20"
                    >
                      <path
                        d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"
                      ></path>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Fecha y hora -->
              <div>
                <label class="text-sm font-medium" for="datetime"
                  >Fecha y hora</label
                >
                <div class="relative mt-1">
                  <select
                    id="datetime"
                    name="datetime"
                    required
                    class="form-select block w-full px-4 py-3 bg-background-light dark:bg-background-dark border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:ring-primary focus:border-primary"
                  >
                    <option>Seleccione fecha y hora</option>
                    <option>Viernes 28/11 - 09:00 hs</option>
                    <option>Sábado 29/11 - 10:30 hs</option>
                    <option>Lunes 01/12 - 11:00 hs</option>
                  </select>

                  <!-- Icono del select -->
                  <div
                    class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2"
                  >
                    <svg class="fill-current h-4 w-4" viewBox="0 0 20 20">
                      <path
                        d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"
                      ></path>
                    </svg>
                  </div>
                </div>
              </div>
            </div>

            <!-- BOTÓN ENVIAR -->
            <div>
              <button
                type="submit"
                class="group w-full flex justify-center py-3 px-4 rounded-lg font-bold text-white bg-primary hover:bg-primary/90 transition-all shadow-sm"
              >
                Reservar turno
              </button>
            </div>
          </form>
        </div>
      </main>

      <!-- SNACKBAR DE CONFIRMACIÓN -->
      <div
        id="snackbar"
        class="fixed bottom-5 right-5 flex items-center bg-secondary text-white py-3 px-5 rounded-lg shadow-lg opacity-0 translate-y-10 transition-all"
      >
        <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor">
          <path
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
        <span>Turno solicitado correctamente</span>
      </div>

      <!-- SCRIPT SNACKBAR -->
      <script>
        const form = document.querySelector("form");
        const snackbar = document.getElementById("snackbar");

        form.addEventListener("submit", (e) => {
          e.preventDefault();

          snackbar.classList.remove("opacity-0", "translate-y-10");
          snackbar.classList.add("opacity-100", "translate-y-0");

          setTimeout(() => {
            snackbar.classList.remove("opacity-100", "translate-y-0");
            snackbar.classList.add("opacity-0", "translate-y-10");
          }, 3000);
        });
      </script>
    </div>
  </body>
</html>
